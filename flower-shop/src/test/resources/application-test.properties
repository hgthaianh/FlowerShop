# Test Configuration for Flower Shop

# H2 In-Memory Database for Testing
spring.datasource.url=jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# JPA Configuration
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false

# JWT Configuration for tests
app.auth.tokenSecret=testTokenSecretKeyForUnitTestingPurposesOnlyMustBeLongEnoughToBeSecure
app.auth.tokenExpirationMsec=864000000

# OAuth2 Configuration - use dummy values for testing
spring.security.oauth2.client.registration.google.client-id=dummy-client-id
spring.security.oauth2.client.registration.google.client-secret=dummy-client-secret

# App OAuth Configuration
app.oauth2.authorizedRedirectUris=http://localhost:3000/oauth2/redirect

# Logging - reduce noise during tests
logging.level.org.springframework.security=WARN
logging.level.org.hibernate.SQL=WARN
