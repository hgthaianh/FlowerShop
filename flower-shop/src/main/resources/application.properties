spring.application.name=flower-shop

# PostgreSQL Configuration
spring.datasource.url=jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:flowershop}
spring.datasource.username=${DB_USER:postgres}
spring.datasource.password=${DB_PASSWORD:postgres}
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA/Hibernate Configuration
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Server Configuration
server.port=${SERVER_PORT:8080}

# Google OAuth2
spring.security.oauth2.client.registration.google.client-id=${GOOGLE_CLIENT_ID}
spring.security.oauth2.client.registration.google.client-secret=${GOOGLE_CLIENT_SECRET}

# VNPay Sandbox
vnpay.tmnCode=${VNPAY_TMN_CODE}
vnpay.hashSecret=${VNPAY_HASH_SECRET}

# File Upload Configuration
spring.servlet.multipart.enabled=true
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=20MB

# Application Configuration
app.upload.base-url=${APP_BASE_URL:http://localhost:8080}

# OAuth2 Redirect (Frontend)
app.oauth2.authorizedRedirectUris=http://localhost:84/oauth2/redirect

# Debug Logging
logging.level.org.springframework.security=DEBUG
logging.level.org.springframework.security.web.FilterChainProxy=DEBUG

# Force standard OAuth2 (disable OIDC)
spring.security.oauth2.client.registration.google.scope=profile,email

# JWT Configuration (Generated secure key for HS512 - 85 chars = 680 bits)
app.auth.tokenSecret=ThisIsAVeryLongAndSecureSecretKeyThatIsDefinitelyMoreThanSixtyFourCharactersLongToSatisfyTheHS512RequirementAndPreventTheWeakKeyExceptionFromSpringSecurityForGoodMeasure1234567890
app.auth.tokenExpirationMsec=864000000
